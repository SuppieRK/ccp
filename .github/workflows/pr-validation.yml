name: PR Validation

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Install validation tools
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          curl --proto "=https" -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.3

      - name: Run local validation helper
        shell: bash
        run: |
          ./scripts/validate.sh

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f .artifacts/coverage/summary.md ]]; then
            cat .artifacts/coverage/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

  benchmark-discover:
    name: Benchmark Discover (PR)
    runs-on: ubuntu-latest
    outputs:
      benchmark_matrix: ${{ steps.select-tools.outputs.benchmark_matrix }}
      has_tools: ${{ steps.select-tools.outputs.has_tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select benchmark tools from changed files
        id: select-tools
        shell: bash
        run: |
          bash ./scripts/benchmark-discover.sh \
            --mode pr \
            --event-name "${{ github.event_name }}" \
            --base-sha "${{ github.event.pull_request.base.sha || '' }}" \
            --head-sha "${{ github.event.pull_request.head.sha || '' }}" \
            --output-file "$GITHUB_OUTPUT" \
            --summary-file "${GITHUB_STEP_SUMMARY:-}"

  benchmark-tool:
    name: Benchmark (PR informational) / ${{ matrix.tool }}
    needs: [validate, benchmark-discover]
    if: needs.benchmark-discover.outputs.has_tools == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.benchmark-discover.outputs.benchmark_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Setup Python
        if: ${{ matrix.needs_python }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Java
        if: ${{ matrix.needs_java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust (cargo)
        if: ${{ matrix.needs_rust }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Deno
        if: ${{ matrix.needs_deno }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        if: ${{ matrix.needs_node }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        if: ${{ matrix.needs_pnpm }}
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Setup kind
        if: ${{ matrix.needs_kind }}
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true

      - name: Build ccp binary
        shell: bash
        run: |
          mkdir -p .bin
          go build -o .bin/ccp ./cmd/ccp
          echo "${GITHUB_WORKSPACE}/.bin" >> "$GITHUB_PATH"

      - name: Pre-pull Docker benchmark images
        if: ${{ matrix.needs_docker_images }}
        shell: bash
        run: |
          docker pull nginx:alpine
          docker pull alpine:latest

      - name: Restore benchmark history cache
        uses: actions/cache/restore@v5
        with:
          path: .artifacts/benchmark-history/${{ matrix.tool }}
          key: benchmark-report-main-${{ matrix.tool }}-v1-
          restore-keys: |
            benchmark-report-main-${{ matrix.tool }}-v1-

      - name: Run benchmark harness for tool
        id: run-benchmark
        shell: bash
        env:
          BENCH_YELLOW_OVERHEAD_ABS_MS: ${{ vars.BENCH_YELLOW_OVERHEAD_ABS_MS || '20' }}
          BENCH_YELLOW_OVERHEAD_REL_PCT: ${{ vars.BENCH_YELLOW_OVERHEAD_REL_PCT || '25' }}
          BENCH_YELLOW_MIN_NATIVE_MS: ${{ vars.BENCH_YELLOW_MIN_NATIVE_MS || '50' }}
        run: |
          set -euo pipefail
          tool="${{ matrix.tool }}"
          out_dir="${GITHUB_WORKSPACE}/.artifacts/benchmark/${tool}"
          history_dir="${GITHUB_WORKSPACE}/.artifacts/benchmark-history/${tool}"
          prev_report="${history_dir}/report.json"
          mkdir -p "$out_dir" "$history_dir"

          (
            cd tools/benchmark
            go run ./cmd/ccp-ci \
              -fixtures-root "${GITHUB_WORKSPACE}/testdata/tool-fixtures" \
              -artifacts-dir "$out_dir" \
              -previous-report "$prev_report" \
              -tool "$tool" \
              -max-artifact-bytes 5242880
          )

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-benchmark-pr-${{ matrix.tool }}
          path: .artifacts/benchmark/${{ matrix.tool }}

  sonarqube-scan:
    name: SonarQube Scan (informational)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Generate internal coverage profile for Sonar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/coverage
          go test -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=.artifacts/coverage/internal.cover ./...

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "SONAR_TOKEN is not configured. Add SONAR_TOKEN in repository secrets/environment to run SonarQube scan." >&2
            exit 1
          fi
          if [[ ! -f sonar-project.properties ]]; then
            echo "sonar-project.properties is missing from repository root." >&2
            exit 1
          fi
          if [[ ! -f .artifacts/coverage/internal.cover ]]; then
            echo "coverage profile missing at .artifacts/coverage/internal.cover." >&2
            exit 1
          fi

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          retention-days: 14
