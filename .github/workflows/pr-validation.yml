name: PR Validation

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  plan:
    name: Plan Validation
    runs-on: ubuntu-latest
    outputs:
      benchmark_matrix: ${{ steps.plan.outputs.benchmark_matrix }}
      has_tools: ${{ steps.plan.outputs.has_tools }}
      run_validate: ${{ steps.plan.outputs.run_validate }}
      run_benchmarks: ${{ steps.plan.outputs.run_benchmarks }}
      change_class: ${{ steps.plan.outputs.change_class }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build validation plan
        id: plan
        shell: bash
        run: |
          bash ./scripts/benchmark-discover.sh \
            --mode pr \
            --event-name "${{ github.event_name }}" \
            --base-sha "${{ github.event.pull_request.base.sha || '' }}" \
            --head-sha "${{ github.event.pull_request.head.sha || '' }}" \
            --output-file "$GITHUB_OUTPUT" \
            --summary-file "${GITHUB_STEP_SUMMARY:-}"

  validate:
    needs: plan
    if: needs.plan.outputs.run_validate == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Cache validation tools and lint state
        uses: actions/cache@v6
        with:
          path: |
            ~/go/bin
            ~/.cache/golangci-lint
          key: validation-tools-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', './scripts/validate.sh', '.github/workflows/main-validation.yml', '.github/workflows/pr-validation.yml') }}
          restore-keys: |
            validation-tools-${{ runner.os }}-

      - name: Install validation tools
        shell: bash
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/gordonklaus/ineffassign@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          curl --proto "=https" -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.3

      - name: Run local validation helper
        shell: bash
        run: |
          ./scripts/validate.sh

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f .artifacts/coverage/summary.md ]]; then
            cat .artifacts/coverage/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

  smoke-installed-binary:
    name: Smoke Installed Binary / ${{ matrix.os }}
    needs: [plan, validate]
    if: needs.plan.outputs.run_validate == 'true' && needs.validate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build and install ccp into runner PATH
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/ccp-smoke-bin"
          mkdir -p "$install_dir"
          bin_path="$install_dir/ccp"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_path="$install_dir/ccp.exe"
          fi
          go build -o "$bin_path" ./cmd/ccp
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run installed binary smoke script
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-smoke.sh

  benchmark-tool:
    name: Benchmark (PR informational) / ${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.run_benchmarks == 'true' && needs.plan.outputs.has_tools == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.benchmark_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Build ccp binary
        shell: bash
        run: |
          mkdir -p .bin
          go build -o .bin/ccp ./cmd/ccp
          echo "${GITHUB_WORKSPACE}/.bin" >> "$GITHUB_PATH"

      - name: Restore benchmark history cache
        uses: actions/cache/restore@v6
        with:
          path: .artifacts/benchmark-history/${{ matrix.tool }}
          key: benchmark-report-main-${{ matrix.tool }}-v2-
          restore-keys: |
            benchmark-report-main-${{ matrix.tool }}-v2-

      - name: Run benchmark harness for tool
        id: run-benchmark
        shell: bash
        env:
          BENCH_YELLOW_OVERHEAD_ABS_MS: ${{ vars.BENCH_YELLOW_OVERHEAD_ABS_MS || '20' }}
          BENCH_YELLOW_OVERHEAD_REL_PCT: ${{ vars.BENCH_YELLOW_OVERHEAD_REL_PCT || '25' }}
          BENCH_YELLOW_MIN_NATIVE_MS: ${{ vars.BENCH_YELLOW_MIN_NATIVE_MS || '50' }}
        run: |
          set -euo pipefail
          tool="${{ matrix.tool }}"
          out_dir="${GITHUB_WORKSPACE}/.artifacts/benchmark/${tool}"
          history_dir="${GITHUB_WORKSPACE}/.artifacts/benchmark-history/${tool}"
          prev_report="${history_dir}/report.json"
          mkdir -p "$out_dir" "$history_dir"

          go run ./cmd/ccp-ci \
            -artifacts-dir "$out_dir" \
            -previous-report "$prev_report" \
            -tool "$tool"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-benchmark-pr-${{ matrix.tool }}
          path: .artifacts/benchmark/${{ matrix.tool }}

  sonarqube-scan:
    name: SonarQube Scan (informational)
    needs: [plan, validate]
    if: needs.plan.outputs.run_validate == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Generate internal coverage profile for Sonar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/coverage
          go test -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=.artifacts/coverage/internal.cover ./...

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "SONAR_TOKEN is not configured. Add SONAR_TOKEN in repository secrets/environment to run SonarQube scan." >&2
            exit 1
          fi
          if [[ ! -f sonar-project.properties ]]; then
            echo "sonar-project.properties is missing from repository root." >&2
            exit 1
          fi
          if [[ ! -f .artifacts/coverage/internal.cover ]]; then
            echo "coverage profile missing at .artifacts/coverage/internal.cover." >&2
            exit 1
          fi

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          retention-days: 14
