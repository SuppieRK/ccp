name: Release Distribution

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag without v prefix (for example: 1.2.3)'
        required: true
        type: string

jobs:
  preflight:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
      source_sha: ${{ steps.resolve-tag.outputs.source_sha }}
      tag_oid: ${{ steps.resolve-tag.outputs.tag_oid }}
    steps:
      - name: Checkout release resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Resolve and validate existing release tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi
          if [[ "${TAG}" == v* ]]; then
            echo "release tag must not start with 'v': ${TAG}" >&2
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match X.Y.Z exactly: ${TAG}" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/ccp-release-tags/${TAG}"
          TAG_OID="$(git rev-parse "refs/ccp-release-tags/${TAG}")"
          SOURCE_SHA="$(git rev-parse "refs/ccp-release-tags/${TAG}^{commit}")"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          {
            echo "tag=${TAG}"
            echo "tag_oid=${TAG_OID}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if release or draft already exists for tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
          status="$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")"
          if [[ "$status" == "200" ]]; then
            echo "release or draft already exists for tag ${TAG}; follow the documented draft-repair procedure"
            jq '{id, tag_name, draft, prerelease, html_url}' /tmp/release.json
            exit 1
          fi
          if [[ "$status" != "404" ]]; then
            echo "unexpected API status while checking tag ${TAG}: ${status}"
            jq . /tmp/release.json || true
            exit 1
          fi

  build-artifacts:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout and tag identity
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
          EXPECTED_TAG_OID: ${{ needs.preflight.outputs.tag_oid }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/ccp-release-tags/${TAG}"
          test "$(git rev-parse "refs/ccp-release-tags/${TAG}")" = "${EXPECTED_TAG_OID}"
          test "$(git rev-parse "refs/ccp-release-tags/${TAG}^{commit}")" = "${EXPECTED_SHA}"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build and inspect archive
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin_name="ccp"
          if [[ "$GOOS" == "windows" ]]; then
            bin_name="ccp.exe"
          fi
          out_bin="dist/${bin_name}"
          ldflags="-s -w -X go-command-compression-proxy/internal/version.Version=${TAG}"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags "$ldflags" -o "$out_bin" ./cmd/ccp
          grep -aFq "${TAG}" "$out_bin"

          host_probe="dist/ccp-version-probe"
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "$host_probe" ./cmd/ccp
          test "$("$host_probe" --version)" = "${TAG}"
          rm -f "$host_probe"

          asset="ccp_${TAG}_${GOOS}_${GOARCH}.zip"
          (
            cd dist
            zip -q "$asset" "$bin_name"
            test "$(unzip -Z1 "$asset")" = "$bin_name"
            rm -f "$bin_name"
          )
          jq -n \
            --arg tag "$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg goos "$GOOS" \
            --arg goarch "$GOARCH" \
            --arg asset "$asset" \
            --arg go_version "$(go version)" \
            '{tag:$tag,source_sha:$source_sha,goos:$goos,goarch:$goarch,asset:$asset,go_version:$go_version,archive_entries:1}' \
            > "dist/${asset}.metadata.json"

      - name: Upload matrix asset and source metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.metadata.json
          retention-days: 1

  create-draft:
    needs: [preflight, build-artifacts]
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Download all assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - name: Verify immutable identity and artifact set
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
          EXPECTED_TAG_OID: ${{ needs.preflight.outputs.tag_oid }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/ccp-release-tags/${TAG}"
          test "$(git rev-parse "refs/ccp-release-tags/${TAG}")" = "${EXPECTED_TAG_OID}"
          test "$(git rev-parse "refs/ccp-release-tags/${TAG}^{commit}")" = "${EXPECTED_SHA}"

          mkdir -p release metadata
          find dist -type f -name '*.zip' -exec cp {} release/ \;
          find dist -type f -name '*.metadata.json' -exec cp {} metadata/ \;
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 6
          test "$(find metadata -maxdepth 1 -type f -name '*.metadata.json' | wc -l)" -eq 6
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              asset="ccp_${TAG}_${goos}_${goarch}.zip"
              test -f "release/${asset}"
              metadata_file="metadata/${asset}.metadata.json"
              test -f "$metadata_file"
              test "$(jq -r .tag "$metadata_file")" = "$TAG"
              test "$(jq -r .source_sha "$metadata_file")" = "$EXPECTED_SHA"
              test "$(jq -r .asset "$metadata_file")" = "$asset"
              test "$(jq -r .archive_entries "$metadata_file")" -eq 1
              expected_binary="ccp"
              [[ "$goos" == "windows" ]] && expected_binary="ccp.exe"
              test "$(unzip -Z1 "release/${asset}")" = "$expected_binary"
            done
          done
          (
            cd release
            sha256sum ./*.zip > ./ccp_checksums.txt
            test "$(wc -l < ./ccp_checksums.txt)" -eq 6
          )

      - name: Generate binary archive attestations
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ./release/*.zip
          predicate-type: https://schemas.go-command-compression-proxy.dev/release/binary-archive-attestation/v1
          predicate: |
            {
              "repository": "${{ github.repository }}",
              "workflow": "release-distribution",
              "scope": "binary-archives-only",
              "sourceSha": "${{ needs.preflight.outputs.source_sha }}",
              "tag": "${{ needs.preflight.outputs.tag }}",
              "attestationActionRef": "actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6"
            }

      - name: Create private draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ needs.preflight.outputs.tag }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./release/*.zip
            ./release/ccp_checksums.txt

  smoke-draft:
    needs: [preflight, create-draft]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) asset="ccp_${TAG}_windows_amd64.zip" ;;
            *) asset="ccp_${TAG}_linux_amd64.zip" ;;
          esac
          gh release download "$TAG" --repo "$REPO" --pattern "$asset" --pattern ccp_checksums.txt

      - name: Smoke install draft asset on Unix
        if: runner.os != 'Windows'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          asset="ccp_${TAG}_linux_amd64.zip"
          grep " ./${asset}$" ccp_checksums.txt | sha256sum --check -
          mkdir -p test-bin
          test "$(unzip -Z1 "$asset")" = "ccp"
          unzip -q "$asset" -d test-bin
          chmod 0755 test-bin/ccp
          test "$(test-bin/ccp --version)" = "$TAG"

      - name: Smoke install draft asset on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "ccp_${env:TAG}_windows_amd64.zip"
          $checksumLine = Get-Content ccp_checksums.txt | Where-Object { $_ -match [regex]::Escape("./$asset") }
          if (-not $checksumLine) { throw "missing checksum for $asset" }
          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "checksum mismatch for $asset" }
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $asset)).Entries
          if ($entries.Count -ne 1 -or $entries[0].FullName -ne "ccp.exe") {
            throw "unexpected archive shape"
          }
          $outDir = Join-Path $PWD "test-bin"
          Expand-Archive -Path $asset -DestinationPath $outDir
          $version = & (Join-Path $outDir "ccp.exe") --version
          if ($version -ne $env:TAG) { throw "unexpected binary version: $version" }

  publish:
    needs: [preflight, smoke-draft]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1

      - name: Publish the validated draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
          EXPECTED_TAG_OID: ${{ needs.preflight.outputs.tag_oid }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/ccp-release-tags/${TAG}"
          test "$(git rev-parse "refs/ccp-release-tags/${TAG}")" = "${EXPECTED_TAG_OID}"
          test "$(git rev-parse "refs/ccp-release-tags/${TAG}^{commit}")" = "${EXPECTED_SHA}"
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
