# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: mypy
about: Group mypy diagnostics by file, preserve exact line and error-code context, drop only the trailing summary footer, and keep clean success output native.
flags_consuming_next_arg: ["--cobertura-xml-report", "--custom-typing-module", "--html-report", "--junit-xml", "--linecount-report", "--lineprecision-report", "--output", "--package", "--python-executable", "--python-version", "--shadow-file", "--txt-report", "--xml-report", "-O", "-p"]

cases:
  - id: explicit_output_passthrough
    when_arguments:
      have_any:
        - -O
        - --output
        - --pretty
        - --show-column-numbers
        - --show-error-context
        - --show-error-end
        - --show-error-code-links
        - --hide-error-codes
        - --no-error-summary
        - --junit-xml
        - --cobertura-xml-report
        - --html-report
        - --linecount-report
        - --lineprecision-report
        - --txt-report
        - --xml-report
    passthrough: true

  - id: diagnostics
    compress_output:
      combined:
        lines:
          skip:
            - starts_with: 'Found '
        groups:
          - id: file
            matches_regex: '^(?P<file>.+?):(?P<line>\d+)(?::\d+)?:\s+(?P<kind>error|warning|note):\s+(?P<message>.+?)(?:\s+\[(?P<code>[^\]]+)\])?$'
            variables:
              - name: file
                type: string
                regex_group: file
              - name: line
                type: string
                regex_group: line
              - name: kind
                type: string
                regex_group: kind
              - name: code
                type: string
                regex_group: code
                default_value: note
              - name: message
                type: string
                regex_group: message
            group_by: '{{file}}'
            initially:
              print: '{{file}}:'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  L{{line}} [{{code}}] {{message}}'
