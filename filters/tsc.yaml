# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: tsc
about: Compact TypeScript diagnostics by file path.
cases:
  - id: passthrough_unsupported
    when_arguments:
      have_any:
        - -w
        - --watch
        - --preserveWatchOutput
        - -b
        - --build
        - -v
        - --version
        - -h
        - --help
        - --init
        - --showConfig
        - --listFiles
        - --listEmittedFiles
        - --explainFiles
        - --diagnostics
        - --extendedDiagnostics
        - --traceResolution
    passthrough: true

  - id: diagnostics
    compress_output:
      combined:
        groups:
          - id: file
            matches_regex: '^(?P<path>.+?)\((?P<line>\d+),(?P<column>\d+)\):\s+error\s+(?P<code>TS\d+):\s+(?P<message>.+)$'
            variables:
              - name: path
                type: string
                regex_group: path
              - name: line
                type: string
                regex_group: line
              - name: column
                type: string
                regex_group: column
              - name: code
                type: string
                regex_group: code
              - name: message
                type: string
                regex_group: message
            group_by: '{{path}}'
            initially:
              print: '{{path}}:'
            lines:
              replace:
                - regex: '^.*$'
                  to: '{{line}}:{{column}} {{code}} {{message}}'
              max:
                count: 6
                print: "\n{{value}} lines"
        lines:
          max:
            count: 40
            print: "\n{{value}} lines"
