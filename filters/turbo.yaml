# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: turbo
about: Compact default Turborepo run orchestration chatter while preserving underlying task output and leaving dry-run, graph, summarize, and other precision/discovery modes native.
flags_consuming_next_arg: []

cases:
  - id: passthrough_discovery_and_precision
    when_arguments:
      have_any:
        - --dry
        - --dry=json
        - --graph
        - --summarize
        - --daemon
        - --help
        - --version
        - --json
    passthrough: true

  - id: run
    when_arguments:
      first_is: run
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^[[:space:]]*$'
            - regex: '^turbo [0-9].+$'
            - regex: '^• Packages in scope: .+$'
            - regex: '^• Running .+$'
            - regex: '^• Remote caching .+$'
            - regex: '^ Tasks:\s+.+$'
            - regex: '^ Cached:\s+.+$'
            - regex: '^ Time:\s+.+$'
          keep:
            - regex: '^([A-Za-z0-9_.-]+):(build|test|lint|typecheck): .+$'
            - regex: '^([A-Za-z0-9_.-]+):(build|test|lint|typecheck): command finished with error .+$'
            - regex: '^ ERROR  run failed: .+$'
            - regex: '^error: .+$'
            - regex: '^Error: .+$'
          replace:
            - regex: '^([A-Za-z0-9_.-]+):(build|test|lint|typecheck): cache hit, .+$'
              to: '$1:$2: cache hit'
            - regex: '^No tasks were executed as part of this run\.$'
              to: 'turbo: no tasks executed'
            - regex: '^ Tasks:\s+(\d+) successful,\s+(\d+) total$'
              to: 'turbo: $1/$2 tasks succeeded'
