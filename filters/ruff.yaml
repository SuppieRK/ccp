# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: ruff
about: Compact structured Ruff diagnostics conservatively and normalize simple `ruff check` flows to Ruff's own grouped format while preserving explicit format, fix, diff, and watch modes.
flags_consuming_next_arg: []

cases:
  - id: explicit_modes_passthrough
    when_arguments:
      first_is: check
      have_any:
        - --output-format
        - --output-format=json
        - --format
        - --format=json
        - --statistics
        - --show-files
        - --show-settings
        - --watch
        - --fix
        - --diff
    passthrough: true

  - id: check_grouped_normalized
    when_arguments:
      first_is: check
      lack_any:
        - --output-format
        - --output-format=json
        - --format
        - --format=json
        - --statistics
        - --show-files
        - --show-settings
        - --watch
        - --fix
        - --diff
    normalize_command:
      append_if_missing:
        - --output-format=grouped

  - id: diagnostics
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^\[$'
            - regex: '^\]$'
        groups:
          - id: file
            matches_regex: '^\{"code":"(?P<code>[^"]+)","message":"(?P<message>.+?)","location":\{"row":(?P<line>\d+),"column":(?P<column>\d+)\},"filename":"(?P<filename>[^"]+)".*$'
            variables:
              - name: code
                type: string
                regex_group: code
              - name: message
                type: string
                regex_group: message
              - name: line
                type: string
                regex_group: line
              - name: column
                type: string
                regex_group: column
              - name: filename
                type: string
                regex_group: filename
            group_by: '{{filename}}'
            initially:
              print: '{{filename}}:'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  {{line}}:{{column}} {{code}} {{message}}'
