# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: go
about: Compact the go command family with conservative passthrough for verbose and structured modes.
flags_consuming_next_arg: []

cases:
  - id: build_verbose_passthrough
    when_arguments:
      first_is: build
      have_any:
        - -x
        - -json
    passthrough: true

  - id: build
    when_arguments:
      first_is: build

  - id: test_json_passthrough
    when_arguments:
      first_is: test
      have_any:
        - -json
        - -v
    passthrough: true

  - id: test
    when_arguments:
      first_is: test
    compress_output:
      stdout:
        lines:
          replace:
            - regex: '^\?\s+(\S+)\s+\[no test files\]$'
              to: '? $1'
            - regex: '^ok\s+(\S+)\s+\(cached\)$'
              to: 'ok $1'
            - regex: '^ok\s+(\S+)\s+[0-9.]+s$'
              to: 'ok $1'
            - regex: '^--- FAIL: ([^(]+) \([^)]+\)$'
              to: '--- FAIL: $1'
            - regex: '^(\s+\S+\.go:\d+:\s+.+)$'
              to: '$1'
            - regex: '^(\s+(?:expected|actual|got|want):\s+.+)$'
              to: '$1'
          skip:
            - regex: '^FAIL$'
