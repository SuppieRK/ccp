# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: npm
about: Placeholder npm filter scaffold for YAML migration.
cases:
  - id: run
    when_arguments:
      first_is: run
    compress_output:
      combined:
        lines:
          skip:
            - starts_with: "> "
            - regex: "^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏].*$"
            - starts_with: "npm notice"
            - starts_with: "Done in "
            - starts_with: "info Visit https://yarnpkg.com"
