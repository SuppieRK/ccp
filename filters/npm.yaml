# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: npm
about: Compact npm run wrapper output conservatively, trim low-value TAP harness noise, and keep npm install failures native.
flags_consuming_next_arg: ["--script-shell", "--workspace", "-w"]

cases:
  - id: run_help_passthrough
    when_arguments:
      first_is: run
      have_any:
        - -h
        - --help
    passthrough: true

  - id: run
    when_arguments:
      first_is: run
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^$'
            - starts_with: "> "
            - regex: "^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏].*$"
            - regex: '^TAP version \d+$'
            - regex: '^  ---$'
            - regex: '^  \.\.\.$'
            - regex: '^  duration_ms: .+$'
            - regex: "^  type: 'test'$"
            - regex: '^# suites 0$'
            - regex: '^# cancelled 0$'
            - regex: '^# skipped 0$'
            - regex: '^# todo 0$'
            - starts_with: "npm notice"
            - starts_with: "Done in "
            - starts_with: "info Visit https://yarnpkg.com"
