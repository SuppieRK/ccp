# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: golangci-lint
about: Group default text-mode golangci-lint diagnostics by file, keep exact file and line identity, and leave explicit structured or tabular output modes native.
flags_consuming_next_arg: ["--enable-only", "--output.checkstyle.path", "--output.code-climate.path", "--output.html.path", "--output.json.path", "--output.junit-xml.path", "--output.sarif.path", "--output.tab.path", "--output.teamcity.path"]

cases:
  - id: help_passthrough
    when_arguments:
      first_is: run
      have_any:
        - -h
        - --help
    passthrough: true

  - id: structured_passthrough
    when_arguments:
      have_any:
        - --output.json.path
        - --output.tab.path
        - --output.html.path
        - --output.checkstyle.path
        - --output.code-climate.path
        - --output.junit-xml.path
        - --output.teamcity.path
        - --output.sarif.path
    passthrough: true

  - id: diagnostics_text
    when_arguments:
      first_is: run
      lack_any:
        - --output.json.path
        - --output.tab.path
        - --output.html.path
        - --output.checkstyle.path
        - --output.code-climate.path
        - --output.junit-xml.path
        - --output.teamcity.path
        - --output.sarif.path
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^\t.*$'
            - regex: '^\s*\^+\s*$'
            - regex: '^\d+ issues?:$'
            - regex: '^\* .*$'
        groups:
          - id: file
            matches_regex: '^(?P<filename>.+):(?P<line>\d+):(?P<column>\d+): (?P<text>.+?) \((?P<linter>[^)]+)\)$'
            variables:
              - name: filename
                type: string
                regex_group: filename
              - name: line
                type: string
                regex_group: line
              - name: column
                type: string
                regex_group: column
              - name: text
                type: string
                regex_group: text
              - name: linter
                type: string
                regex_group: linter
            group_by: '{{filename}}'
            initially:
              print: '{{filename}}:'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  {{line}}:{{column}} {{linter}} {{text}}'
