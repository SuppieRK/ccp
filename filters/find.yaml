# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: find
about: >-
  Compact standard find path listings by factoring repeated parent prefixes while
  preserving native command shape and follow-up shell usability. Keep nested
  execution and machine-oriented modes such as -exec, -print0, and -printf as
  passthrough. Preserve the simple flat form for explicit `find . -type d`,
  group other rooted directory and file listings by parent, and treat overflow
  summaries as additive hints about omitted grouped items rather than as a
  replacement for concrete paths.
flags_consuming_next_arg: ["-fprintf", "-fprint", "-fprint0", "-group", "-iname", "-ipath", "-maxdepth", "-mindepth", "-mtime", "-name", "-path", "-printf", "-size", "-type", "-user"]

cases:
  - id: nested_execution_or_machine_output
    when_arguments:
      have_any:
        - -exec
        - -execdir
        - -ok
        - -okdir
        - -print0
        - -fprint
        - -fprint0
        - -printf
        - -fprintf
    passthrough: true

  - id: directories_current_root
    when_arguments:
      first_is: .
      have_sequence:
        - -type
        - d
    compress_output:
      combined:
        lines:
          max:
            count: 200
            print: "\n+{{value}} more"
          skip:
            - regex: '^\.$'
          replace:
            - regex: '^\./(.+)$'
              to: '$1/'

  - id: directories_other_roots
    when_arguments:
      have_sequence:
        - -type
        - d
      positionals_lack_any:
        - .
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^\.$'
          max:
            count: 200
            print: "\n+{{value}} more"
        groups:
          - id: by_parent_dir
            variables:
              - name: dir
                type: string
                regex_group: dir
                default_value: '.'
              - name: name
                type: string
                regex_group: name
            matches_regex: '^(?:\./)?(?P<dir>.+)/(?P<name>(?:\.[^/]+|[^./][^/]*))$'
            group_by: '{{dir}}'
            initially:
              print: '{{dir}}/'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  {{name}}/'

  - id: files
    compress_output:
      combined:
        lines:
          max:
            count: 200
            print: "\n+{{value}} more {{groups_summary}}"
            groups_summary:
              show: 3
              print: "{{key}}/({{count}})"
              delimiter: ", "
              prefix: "across "
              suffix: " and {{remaining}} other dirs"
        groups:
          - id: by_parent_dir
            variables:
              - name: dir
                type: string
                regex_group: dir
                default_value: '.'
              - name: name
                type: string
                regex_group: name
            matches_regex: '^(?:\./)?(?:(?P<dir>.+)/)?(?P<name>[^/]+)$'
            group_by: '{{dir}}'
            initially:
              print: '{{dir}}/'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  {{name}}'
