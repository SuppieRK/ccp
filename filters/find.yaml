version: 1
filter: find
about: Start find migration with conservative directory compaction while grouped file rendering is still pending

cases:
  - id: nested_execution_or_machine_output
    when_arguments:
      have_any:
        - -exec
        - -execdir
        - -ok
        - -okdir
        - -print0
        - -fprint0
        - -printf
        - -fprintf
    passthrough: true
  - id: directories
    when_arguments:
      have_sequence:
        - -type
        - d
    compress_output:
      combined:
        lines:
          max:
            count: 200
            print: "\n+{{value}} more"
          skip:
            - regex: '^\.$'
          replace:
            - regex: '^\./(.+)$'
              to: '$1/'
  - id: files
    compress_output:
      combined:
        lines:
          max:
            count: 200
            print: "\n+{{value}} more"
        groups:
          - id: by_parent_dir
            variables:
              - name: dir
                type: string
                regex_group: dir
                default_value: '.'
              - name: name
                type: string
                regex_group: name
            matches_regex: '^\./(?:(?P<dir>.+)/)?(?P<name>[^/]+)$'
            group_by: '{{dir}}'
            initially:
              print: '{{dir}}/'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  {{name}}'
