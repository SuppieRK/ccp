# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: pnpm
about: Compact pnpm install/list/outdated output while preserving real package state, dependency identities, and no-lockfile diagnostics.
flags_consuming_next_arg: []

cases:
  - id: install
    when_arguments:
      first_is: install
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^Scope: .+$'
            - regex: '^Lockfile is up to date, resolution step is skipped$'
            - regex: '^Already up to date$'
            - regex: '^Progress: .+$'
            - regex: '^Packages: \+\d+$'
            - regex: '^\++$'
            - regex: '^dependencies:$'
            - regex: '^devDependencies:$'
            - regex: '^\+ .+$'
            - regex: '^> .+$'
            - regex: '^╭ .+$'
            - regex: '^╰.+$'
            - regex: '^│\s*│$'
            - regex: '^[[:space:]]*$'
          replace:
            - regex: '^│\s+(\S.*\S|\S)\s+│$'
              to: '$1'

  - id: list
    when_arguments:
      first_is: list
      lack_any:
        - --json
    compress_output:
      combined:
        groups:
          - id: dependencies
            matches_regex: '^(?:├── |└── )(?P<pkg>@[^@/\s]+/[^@\s]+@\S+|@?[^@\s]+@\S+).*$'
            variables:
              - name: section
                type: string
                initial_value: dependencies
              - name: pkg
                type: string
                regex_group: pkg
            group_by: '{{section}}'
            initially:
              print: 'dependencies:'
            lines:
              replace:
                - regex: '^.*$'
                  to: '  {{pkg}}'

  - id: outdated
    when_arguments:
      first_is: outdated
    compress_output:
      combined:
        lines:
          replace:
            - regex: '^.*ERR_PNPM_OUTDATED_NO_LOCKFILE.*$'
              to: 'pnpm outdated: no lockfile, run pnpm install first'
