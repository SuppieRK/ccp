# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: docker
about: Compact BuildKit-heavy Docker build output where the end state is tool-defined, keep inventory tables and logs native, and leave machine-oriented build modes untouched.
flags_consuming_next_arg: ["--iidfile", "--metadata-file", "--progress", "--tag", "-t"]

cases:
  - id: build_passthrough_machine
    when_arguments:
      first_is: build
      have_any:
        - -q
        - --quiet
        - --progress
        - --progress=plain
        - --progress=quiet
        - --progress=rawjson
        - --iidfile
        - --metadata-file
        - --push
        - --load
    passthrough: true

  - id: build_tagged_short
    when_arguments:
      first_is: build
      have_any:
        - -t
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^.*$'
          replace:
            - regex: '^#\d+ naming to (?:docker\.io/library/)?(\S+?)(?: \S+)?(?: done)?$'
              to: '[ok] $1 built'

  - id: build_tagged_long
    when_arguments:
      first_is: build
      have_any:
        - --tag
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^.*$'
          replace:
            - regex: '^#\d+ naming to (?:docker\.io/library/)?(\S+?)(?: \S+)?(?: done)?$'
              to: '[ok] $1 built'

  - id: compose_build
    when_arguments:
      have_sequence:
        - compose
        - build
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^.*$'
          replace:
            - regex: '^\s*project-(\S+)\s+Built$'
              to: '[ok] $1 built'
