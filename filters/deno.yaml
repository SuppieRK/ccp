# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: deno
about: Keep Deno run output native unless a tool-defined mode is clearly safe, passthrough structured output, and compact only the narrow test type-check failure surface.
flags_consuming_next_arg: []

cases:
  - id: structured_passthrough
    when_arguments:
      have_any: ["--json"]
    passthrough: true

  - id: test_failure
    when_arguments:
      have_any: ["test"]
    compress_output:
      stderr:
        lines:
          keep:
            - contains: 'TS'
            - contains: 'error:'
