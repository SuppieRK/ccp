# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: eslint
about: Compact plain ESLint text diagnostics into path-first line-oriented output while keeping exact file, line, rule, and severity identity.
flags_consuming_next_arg: ["--format", "--output-file", "-f", "-o"]

cases:
  - id: explicit_output_passthrough
    when_arguments:
      have_any:
        - -f
        - --format
        - -o
        - --output-file
    passthrough: true

  - id: default
    compress_output:
      stdout:
        lines:
          skip:
            - regex: '^$'
            - regex: '^✖ .+$'
            - regex: '^\s+\d+ errors? and \d+ warnings? potentially fixable .+$'
          replace:
            - regex: '^.+/(src/.+)$'
              to: '$1'
            - regex: '^\s*(\d+):(\d+)\s+(error|warning)\s+(.+?)\s{2,}(\S+)$'
              to: '$1:$2 $3 $5 $4'
