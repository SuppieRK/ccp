# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: playwright
about: Compact native Playwright test summaries conservatively, preserve failed spec selectors and startup parser guidance, and keep reporter modes passthrough.
flags_consuming_next_arg: []

cases:
  - id: reporter_passthrough
    when_arguments:
      have_any: ["--reporter", "--reporter=json"]
    passthrough: true

  - id: test_summary
    when_arguments:
      first_is: "test"
    compress_output:
      combined:
        lines:
          keep:
            - starts_with: 'SyntaxError:'
            - regex: '^\s+\d+\s+\|\s+.+$'
            - regex: '^>\s*\d+\s+\|\s+.+$'
            - regex: '^\s+\|\s+\^$'
            - regex: '^\s+at .+$'
            - regex: '^\s*[×✗✘]\s+.+$'
            - regex: '^\s+Error: .+$'
            - starts_with: 'Error: No tests found.'
            - starts_with: 'Make sure that arguments are regular expressions matching test files.'
            - starts_with: 'You may need to escape symbols like "$" or "*" and quote the arguments.'
            - regex: '^\s+screenshot: .+$'
          replace:
            - regex: '^\s*(\d+) passed \(([^)]+)\)$'
              to: 'playwright: $1 passed, 0 failed ($2)'
            - regex: '^\s*(\d+) passed, (\d+) failed \(([^)]+)\)$'
              to: 'playwright: $1 passed, $2 failed ($3)'
            - regex: '^\s*[×✗✘]\s+(.+)$'
              to: '- $1'
