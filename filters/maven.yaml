# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: maven
about: Trim Maven info-level boilerplate aggressively, keep build phases and warnings visible, preserve actionable compiler and test failure blocks, and leave terse reactor-selection failures close to native.
flags_consuming_next_arg: []

cases:
  - id: explicit-output-or-debug-passthrough
    when_arguments:
      have_any:
        - --quiet
        - -q
        - --debug
        - -X
        - --errors
        - -e
        - --log-file
        - -l
        - --batch-mode
        - -B
        - --no-transfer-progress
    passthrough: true

  - id: maven_output
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^WARNING: A terminally deprecated method in sun\.misc\.Unsafe has been called$'
            - regex: '^WARNING: sun\.misc\.Unsafe::staticFieldBase has been called by .*HiddenClassDefiner.*$'
            - regex: '^WARNING: Please consider reporting this to the maintainers of class com\.google\.inject\.internal\.aop\.HiddenClassDefiner$'
            - regex: '^WARNING: sun\.misc\.Unsafe::staticFieldBase will be removed in a future release$'
            - starts_with: '[INFO]'
            - starts_with: 'Signed-off-by: '
          replace:
            - regex: '^\[ERROR\] \[ERROR\] (.+)$'
              to: '[ERROR] $1'
            - regex: '^\[INFO\] --- .+:([A-Za-z0-9_-]+) \([^)]+\) @ ([^ ]+) ---$'
              to: '$2 : $1'
            - regex: '^\[INFO\] BUILD SUCCESS$'
              to: 'BUILD SUCCESS'
            - regex: '^\[INFO\] BUILD FAILURE$'
              to: 'BUILD FAILURE'
