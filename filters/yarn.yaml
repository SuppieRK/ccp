version: 1
filter: yarn
about: Placeholder yarn filter scaffold for YAML migration.
cases:
  - id: run
    when_arguments:
      first_is: run
    compress_output:
      combined:
        lines:
          skip:
            - starts_with: "yarn run v"
            - starts_with: "$ "
            - starts_with: "Done in "
            - starts_with: "info Visit https://yarnpkg.com"
