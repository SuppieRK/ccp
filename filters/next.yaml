# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: next
about: Compact Next.js build output conservatively, keep config-load failures native, preserve actionable compile diagnostics, and retain a compact route/build summary on success.
flags_consuming_next_arg: []

cases:
  - id: build_help_passthrough
    when_arguments:
      first_is: "build"
      have_any:
        - -h
        - --help
    passthrough: true

  - id: build_summary
    when_arguments:
      first_is: "build"
    compress_output:
      combined:
        lines:
          keep:
            - regex: '^\s*▲ Next\.js .+$'
            - contains: 'DeprecationWarning:'
            - starts_with: '(Use `node --trace-deprecation'
            - starts_with: 'Local search index generated'
            - regex: '^Generated \d+ documents in \.contentlayer$'
            - regex: '^\s*⚠ .+$'
            - regex: '^\s*⨯ Failed to load next\.config\.js.+$'
            - regex: '^> Build error occurred$'
            - regex: '^\[Error: .+$'
            - regex: '^Require stack:$'
            - regex: '^- .+$'
            - regex: "^  code: '.+',$"
            - regex: '^  requireStack: \[Array\]$'
            - regex: '^}$'
            - regex: '^Failed to compile\.$'
            - regex: '^\.\/.+$'
            - regex: '^Error: .+$'
            - regex: '^\s*,-\[.+:\d+:\d+\]$'
            - regex: '^\s*\d+\s*\| .+$'
            - regex: '^\s*: .+\^.*$'
            - regex: '^\s*`----$'
            - contains: 'Unexpected eof'
            - regex: '^Caused by:$'
            - regex: '^\s+Syntax Error$'
            - regex: '^Import trace for requested module:$'
            - regex: '^> Build failed because of webpack errors$'
            - regex: '^Route \(app\).+$'
            - regex: '^[┌├└]\s+[○●ƒ] .+$'
            - regex: '^\+ First Load JS shared by all.+$'
            - regex: '^[○●ƒ]  \(.+\).+$'
          replace:
            - regex: '^Build already optimized using cache$'
              to: 'next build: cached'
            - regex: '^Failed to compile\.$'
              to: "next build: failed\nFailed to compile."
            - regex: '^Generated (\d+) documents in \.contentlayer$'
              to: 'contentlayer: $1 docs'
            - regex: '^\s*✓ Compiled successfully in .+$'
              to: 'next build: compiled'
            - regex: '^\s*✓ Generating static pages \(\d+/\d+\)$'
              to: 'next build: static pages ready'
            - regex: '^[┌├└]\s+([○●ƒ])\s+(/[^ ]*).*$'
              to: '$1 $2'
