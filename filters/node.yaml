# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: node
about: Compact repeated Node.js warnings and trim loader-boilerplate from safe `node -p` failure stacks while keeping broader runtime failures native.
flags_consuming_next_arg: ["--print", "-p"]

cases:
  - id: warning_dedupe
    when_arguments:
      have_any: ["warning_dedupe.js"]
    compress_output:
      combined:
        lines:
          keep:
            - contains: "ExperimentalWarning:"
            - starts_with: "(Use `node --trace-warnings"
            - regex: '^\s+at .+:\d+:\d+\)?$'
            - regex: '^application payload$'

  - id: eval_loader_stack_trim
    when_arguments:
      have_any: ["-p", "--print"]
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^    at wrapSafe \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at Module\._compile \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at Object\.\.js \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at Module\.load \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at Function\._load \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at TracingChannel\.traceSync \(node:diagnostics_channel:\d+:\d+\)$'
            - regex: '^    at wrapModuleLoad \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at Module\.require \(node:internal/modules/cjs/loader:\d+:\d+\)$'
            - regex: '^    at require \(node:internal/modules/helpers:\d+:\d+\)$'
