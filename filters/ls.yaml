# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: ls
about: Compact long ls listings while preserving explicit path roots, recursive section headers, and native precision modes like --dired and quoted-name output
flags_consuming_next_arg: ["--block-size", "--format", "--hide", "--ignore", "--indicator-style", "--quoting-style", "--sort", "--tabsize", "--time", "--time-style", "--width", "-I", "-T", "-w"]

cases:
  - id: long_dired_passthrough
    when_arguments:
      have_any:
        - --dired
        - --zero
    passthrough: true

  - id: long_quoted_short_passthrough
    when_arguments:
      have_short_flag:
        - -Q
    passthrough: true

  - id: long_quoted_long_passthrough
    when_arguments:
      have_any:
        - --quote-name
    passthrough: true

  - id: long_recursive
    variables:
      - name: dirs
        type: number
      - name: files
        type: number
    when_arguments:
      have_all_short_flags:
        - -l
        - -R
    normalize_command:
      add_short_flags:
        - -h
      append_if_no_positionals:
        - .
    compress_output:
      combined:
        groups:
          - id: recursive_sections
            starts_with_regex: '^(?P<path>.+):$'
            variables:
              - name: path
                type: string
                regex_group: path
            initially:
              print: '{{path}}:'
            lines:
              replace:
                - regex: '^(?:\S+\s+)?d\S*(?:\s+\S+){7}\s+(.+?)/?$'
                  to: '  $1/'
                  on_match:
                    - variable: dirs
                      increment: 1
                - regex: '^(?:\S+\s+)?[\-l]\S*(?:\s+\S+){3}\s+(\S+)(?:\s+\S+){3}\s+(.+)$'
                  to: '  $2  $1'
                  on_match:
                    - variable: files
                      increment: 1
              skip:
                - regex: '^(?i)(total|insgesamt)\s+'
                - regex: '^[[:space:]]*$'
                - regex: '^[^\n]*\s\.\.?$'

  - id: long
    variables:
      - name: dirs
        type: number
      - name: files
        type: number
    when_arguments:
      have_short_flag:
        - -l
    normalize_command:
      add_short_flags:
        - -a
        - -h
      append_if_no_positionals:
        - .
    compress_output:
      combined:
        lines:
          replace:
            - regex: '^(?:\S+\s+)?d\S*(?:\s+\S+){7}\s+(.+?)/?$'
              to: '$1/'
              on_match:
                - variable: dirs
                  increment: 1
            - regex: '^(?:\S+\s+)?[\-l]\S*(?:\s+\S+){3}\s+(\S+)(?:\s+\S+){3}\s+(.+)$'
              to: '$2  $1'
              on_match:
                - variable: files
                  increment: 1
          skip:
            - regex: '^(?i)(total|insgesamt)\s+'
            - regex: '^[^\n]*\s\.\.?$'
    finally:
      print: "\n{{dirs}} dirs, {{files}} files"
