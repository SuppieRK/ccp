# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/cmdshape/refs/heads/main/schemas/cmdshape-filter.schema.json
version: 1
filter: trunk
about: Compact default `trunk build` output by dropping repetitive Rust compile and fetch noise while preserving final build summaries and compiler failures.
flags_consuming_next_arg: []

cases:
  - id: explicit-diagnostic-or-output-passthrough
    when_arguments:
      first_is: build
      have_any:
        - --verbose
        - -v
        - --filehash
        - --public-url
        - --dist
        - --release
        - --offline
        - --locked
        - --color
    passthrough: true

  - id: build
    when_arguments:
      first_is: build
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^[[:space:]]*$'
            - regex: '^[[:space:]]*Compiling .+$'
            - regex: '^[[:space:]]*Downloading .+$'
            - regex: '^[[:space:]]*Fetching .+$'
            - regex: '^[[:space:]]*Fresh .+$'
            - regex: '^[[:space:]]*Checking .+$'
