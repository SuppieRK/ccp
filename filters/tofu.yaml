# yaml-language-server: $schema=https://raw.githubusercontent.com/SuppieRK/ccp/refs/heads/main/schemas/ccp-filter.schema.json
version: 1
filter: tofu
about: Compact common OpenTofu fmt, init, validate, and plan surfaces while keeping parse or machine-oriented modes reusable and line-oriented.
flags_consuming_next_arg: []

cases:
  - id: plan_json_passthrough
    when_arguments:
      first_is: plan
      have_any:
        - -json
    passthrough: true

  - id: fmt
    when_arguments:
      first_is: fmt
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^[[:space:]]*$'

  - id: init
    when_arguments:
      first_is: init
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^[[:space:]]*$'
            - regex: '^Initializing the backend\.\.\.$'
            - regex: '^Initializing provider plugins\.\.\.$'
            - regex: '^OpenTofu encountered problems during initialization, including problems$'
            - regex: '^with the configuration, described below\.$'
            - regex: '^The OpenTofu configuration must be valid before initialization so that$'
            - regex: '^OpenTofu can determine which modules and providers need to be installed\.$'
            - regex: '^You may now begin working with OpenTofu\. Try running "tofu plan" to see$'
            - regex: '^any changes that are required for your infrastructure\. All OpenTofu commands$'
            - regex: '^should now work\.$'
            - regex: '^If you ever set or change modules or backend configuration for OpenTofu,$'
            - regex: '^rerun this command to reinitialize your working directory\. If you forget, other$'
            - regex: '^commands will detect it and remind you to do so if necessary\.$'

  - id: validate
    when_arguments:
      first_is: validate
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^[[:space:]]*$'
          replace:
            - regex: '^Success! The configuration is valid\.$'
              to: 'tofu validate: ok'

  - id: plan
    when_arguments:
      first_is: plan
    compress_output:
      combined:
        lines:
          skip:
            - regex: '^[[:space:]]*$'
            - regex: '^Acquiring state lock\. This may take a few moments\.\.\.$'
            - regex: '^Releasing state lock\. This may take a few moments\.\.\.$'
            - regex: '^Refreshing state\.\.\..+$'
            - regex: '^OpenTofu used the selected providers to generate the following execution$'
            - regex: '^plan\. Resource actions are indicated with the following symbols:$'
            - regex: '^  \+ create$'
            - regex: '^  - destroy$'
            - regex: '^  ~ update in-place$'
            - regex: '^  -/\+ destroy and then create replacement$'
            - regex: '^─────────────────────────────────────────────────────────────────────────────$'
            - regex: "^Note: You didn't use the -out option to save this plan, so OpenTofu can't$"
            - regex: '^guarantee to take exactly these actions if you run "tofu apply" now\.$'
            - regex: '^OpenTofu has compared your real infrastructure against your configuration and$'
            - regex: '^found no differences, so no changes are needed\.$'
